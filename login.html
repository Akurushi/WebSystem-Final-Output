<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <!-- LEFT SECTION -->
    <div class="left-panel">
      <div class="brand">
        <img src="Photo/logo.jpg" alt="Description of my photo" style="width: 60px; height: 60px; border-radius: 50%; background-color: var(--color-sage);">
        <h1>Senior Citizens Hub</h1>
      </div>
      <div class="content">
        <h2>Welcome Back</h2>
        <p>
          Learn how to safely use online services, identify scams,
          and build confidence in navigating the digital.
        </p>
        <img src="Photo/login.png" alt="Description of my photo" class="illustration">
      </div>
    </div>

    <!-- RIGHT SECTION -->
    <div class="right-panel">

      <a href="index.html" class="back-btn">← Back to Home</a>

      <div class="login-box">

        <h2>Log In</h2>
        <p>Please enter your account details to continue.</p>


        <form onsubmit="window.location.href='mainpage.html'; return false;">

          <div class="input-group">
            <label>Username</label>
            <input type="text" placeholder="Enter your username" />
          </div>

          <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Enter your password" />
          </div>

          <!-- ← Change "dashboard.html" in the form's onsubmit above
               to update where this button takes the user -->
          <button type="submit" class="login-btn">Login</button>

        </form>

        <div class="signup-text">
          Don't have an account?
          <a href="signup.html">Sign Up</a>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
