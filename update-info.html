<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Update Personal Information</title>

<style>
:root{
  --sage:#87a878;
  --forest:#2d4a2d;
  --line:#b7c7b1;
  --panel:#e7efe3;
}

body{
  margin:0;
  font-family:system-ui;
  background:#f0f3ef;
  color:#0b0b0b;
}

nav{
  background:var(--sage);
  padding:14px 24px;
  display:flex;
  justify-content:space-between;
  color:white;
}

.container{
  max-width:900px;
  margin:24px auto;
  padding:0 16px;
}

.card{
  background:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:22px;
}

h2{
  color:var(--forest);
  margin-bottom:6px;
}

.subtitle{
  color:#444;
  margin-bottom:18px;
  font-size:0.95rem;
}

/* Sections */
.section{
  margin-top:18px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel);
}

.section h3{
  margin-bottom:12px;
  color:var(--forest);
  font-size:1rem;
}

label{
  display:block;
  font-weight:600;
  margin-top:10px;
}

input{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid var(--line);
  font-size:1rem;
}

.button{
  margin-top:18px;
  background:var(--forest);
  color:white;
  padding:12px 18px;
  border:none;
  border-radius:8px;
  font-size:1rem;
  cursor:pointer;
  width:100%;
}

.button:hover{
  background:#255a25;
}
</style>
</head>

<body>

<nav>
  <div>Senior Citizens Hub</div>
  <a href="guide.html" style="color:white;">← Back</a>
</nav>

<div class="container">
  <div class="card">
    
    <h2>Update Personal Information</h2>
    <div class="subtitle">Keep your details updated to avoid service delays.</div>

    <div class="section">
      <h3>Contact Information</h3>

      <label>Phone Number</label>
      <input type="text" placeholder="09XXXXXXXXX">

      <label>Email Address</label>
      <input type="email" placeholder="example@email.com">
    </div>

    <div class="section">
      <h3>Home Address</h3>

      <label>Street Address</label>
      <input type="text">

      <label>City / Province</label>
      <input type="text">
    </div>

    <button class="button">Save Changes</button>

  </div>
</div>

</body>
</html>
